rn!==0){timer=setTimeout(()=>{if(state&&state.phase==='play'&&!state.busy)play(state.turn,botCard(state.turn))},520)}}function winning(trick){let lead=trick[0].card.s;return trick.reduce((best,t)=>{let score=x=>x.card.s===state.trump?100+x.card.r:x.card.s===lead?x.card.r:0;return score(t)>score(best)?t:best},trick[0])}function resolveTrick(){if(!state||state.trick.length!==4)return;let w=winning(state.trick),points=state.trick.reduce((sum,t)=>sum+cardValueThirds(t.card),0);if(state.tricks===9)points+=3;state.thirds[team(w.p)]+=points;state.tricks++;state.history.push({winner:w.p,points});toast('Presa di '+NAMES[w.p]);state.leader=w.p;state.turn=w.p;state.trick=[];state.busy=false;if(state.tricks===10){state.phase='end';render();timer=setTimeout(endDeal,800)}else{render();runTurn()}}function endDeal(){if(!state)return;let base=state.thirds.map(v=>Math.floor(v/3)),bonus=[0,0];if(state.cricca!==-1)bonus[team(state.cricca)]+=3;let earned=base.map((x,i)=>x+bonus[i]);state.scores[0]+=earned[0];state.scores[1]+=earned[1];render();let done=state.scores[0]>=41||state.scores[1]>=41;let winner=state.scores[0]===state.scores[1]?'Pareggio':state.scores[0]>state.scores[1]?'Noi':'Loro';modal(done?(winner==='Noi'?'🏆 VITTORIA!':'Partita conclusa'):'Smazzata conclusa',`<p>Questa smazzata: <b>Noi ${earned[0]} — ${earned[1]} Loro</b></p><p>Punti delle carte: ${base[0]}–${base[1]}<br>Cricca: +${bonus[0]} / +${bonus[1]}<br><b>Totale: ${state.scores[0]} — ${state.scores[1]}</b></p><p class="mini">${done?'La partita è terminata.': 'Si continua fino a 41 punti.'}</p>`,`<button class="primary" style="margin:8px 0" onclick="${done?'start()':'nextDeal()'}">${done?'🔄 Nuova partita':'▶ Prossima smazzata'}</button><button class="small-btn" onclick="goHome()">Torna alla Home</button>`)}function nextDeal(){closeModal();newDeal()}function goHome(){clearTimeout(timer);state=null;closeModal();show('home')}$('start').addEventListener('click',start);$('start').dataset.ready='true';$('back').onclick=()=>
