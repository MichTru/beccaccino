ottom"><div id="errorBox" style="display:none;background:#802b44;color:white;padding:12px;border-radius:12px;margin-bottom:12px;font-size:13px"></div><button class="primary" id="start" type="button" >🃏 GIOCA ORA</button><button class="secondary" id="info">👥 Stanza privata · in arrivo</button><div class="panel hint">🎯 Partita autentica a 41 punti · 2 contro 2<br>Prima versione offline contro 3 bot</div></div></section><section id="game" class="screen table-screen"><div class="scorebar"><button class="toplink" id="back">‹</button><div class="score"><small>🔵 NOI</small><strong id="ourScore">0</strong></div><div class="round" id="roundLabel">SMAZZATA 1<br>BRISCOLA: —</div><div class="score red"><small>🔴 LORO</small><strong id="theirScore">0</strong></div></div><div class="table"><div class="table-label" id="status">Distribuzione…</div><div class="seat top" id="seat2"><div class="avatar emoji">😎</div><small>Anto</small><div class="backs" id="back2"></div></div><div class="seat left" id="seat1"><div class="avatar emoji">🧢</div><small>Simo</small><div class="backs" id="back1"></div></div><div class="seat right" id="seat3"><div class="avatar emoji">😏</div><small>Nadir</small><div class="backs" id="back3"></div></div><div class="seat me" id="seat0"><img class="avatar" src="assets/michi.png" alt="Michi"><small>Michi · TU</small></div><div class="play-area" id="playArea"></div></div><div class="hand" id="hand"></div><div class="actions"><button class="action" id="busso">💬 Busso</button><button class="action" id="striscio">🃏 Striscio</button><button class="action" id="volo">⚡ Volo</button></div><div class="footerline" id="footer">Tocca una carta per giocarla</div></section><div id="overlay"></div><div id="toastRoot"></div></div><script>

if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){});}const SUITS=['denara','coppe','spade','bastoni'], SYMBOLS=['☀','🏆','⚔','🌿'], COLORS=['coin','cup','sword','club'], NAMES=['Michi','Simo','Anto','Nadir'];let state=null,timer=null,toastTimer=null;const $=id=>document.getElementById(id);const wait=ms=>new Promise(r=>setTimeout(r,ms));function toast(t){$('toastRoot').innerHTML='<div class="toast">'+t+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toastRoot').innerHTML='',1900)}function cardHtml(c,extra=''){const rows=[2,1,3,0];const cols={8:0,9:1,10:2,1:3,2:4,3:5,4:6,5:7,6:8,7:9};const x=(cols[c.r]/9*100).toFixed(5)+'%';const y=(rows[c.s]/3*100).toFixed(5)+'%';return `<div class="card ${extra}" data-id="${c.id}" aria-label="${c.r===10?'3':c.r===9?'2':c.r===8?'Asso':c.r===7?'Re':c.r===6?'Cavallo':c.r===5?'Fante':c.r===4?'7':c.r===3?'6':c.r===2?'5':'4'} di ${SUITS[c.s]}"><span class="face" style="--cx:${x};--cy:${y}"></span></div>`}function deck(){let d=[];for(let s=0;s<4;s++)for(let r=1;r<=10;r++)d.push({s,r,id:s+'-'+r});return d}function strength(c){return c.r}function cardValueThirds(c){return [5,6,7,9,10].includes(c.r)?1:c.r===8?3:0}function shuffle(d){for(let i=d.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}function modal(title,body,buttons=''){ $('overlay').innerHTML=`<div class="modal"><div class="modalbox"><h2>${title}</h2>${body}${buttons}</div></div>`}function closeModal(){$('overlay').innerHTML=''}function show(screen){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(screen).classList.add('active')}function start(){try{if(state&&document.getElementById('game').classList.contains('active'))return;state={scores:[0,0],round:0,chooser:null,leader:0,turn:0,phase:'deal',trump:null,hands:[],trick:[],thirds:[0,0],tricks:0,cricca:null,history:[],busy:false};show('game');newDeal()}catch(e){show('home');$('errorBox').style.display='block';$('errorBox').textContent='Impossibile avviare: '+e.message;console.error(e)}}window.beccStart=start;function newDeal(){if(!state)return;clearTimeout(timer);state.round++;state.phase='deal';state.trick=[];state.thirds=[0,0];state.tricks=0;state.cricca=null;state.history=[];let d=shuffle(deck());state.hands=[d.slice(0,10),d.slice(10,20),d.slice(20,30),d.slice(30,40)];state.hands.forEach(h=>h.sort((a,b)=>a.s-b.s||b.r-a.r));if(state.chooser===null){state.chooser=state.hands.findIndex(h=>h.some(c=>c.s===0&&c.r===1))}else state.chooser=(state.chooser+1)%4;state.leader=state.chooser;state.turn=state.chooser;state.trump=null;render();if(state.chooser===0){state.phase='choose';chooseModal()}else{state.trump=Math.floor(Math.random()*4);toast(NAMES[state.chooser]+' sceglie '+SUITS[state.trump]);afterTrump()}}function chooseModal(){modal('Scegli la briscola','<p>Hai il 4 di denara: scegli il seme di briscola.</p><div class="suit-grid">'+SUITS.map((s,i)=>`<button class="suit-button" onclick="pickTrump(${i})"><span>${SYMBOLS[i]}</span>${s}</button>`).join('')+'</div>')}function pickTrump(s){if(!state||state.phase!=='choose')return;state.trump=s;closeModal();afterTrump()}function afterTrump(){state.cricca=state.hands.findIndex(h=>[8,9,10].every(r=>h.some(c=>c.s===state.trump&&c.r===r)));if(state.cricca>=0){toast('👑 Cricca: '+NAMES[state.cricca]+'! +3 alla squadra');}state.phase='play';render();runTurn()}function team(p){return p%2===0?0:1}function validCards(p){let h=state.hands[p];if(!state.trick.length)return h;let lead=state.trick[0].card.s;return h.some(c=>c.s===lead)?h.filter(c=>c.s===lead):h}function render(){if(!state)return;$('ourScore').textContent=state.scores[0];$('theirScore').textContent=state.scores[1];$('roundLabel').innerHTML='SMAZZATA '+state.round+'<br>BRISCOLA: '+(state.trump===null?'—':SYMBOLS[state.trump]+' '+SUITS[state.trump]);$('status').textContent=state.phase==='play'?'TURNO: '+NAMES[state.turn]:state.phase==='deal'?'Distribuzione…':'Fine smazzata';for(let p=0;p<4;p++){$('seat'+p).classList.toggle('active',state.phase==='play'&&state.turn===p);if(p)$('back'+p).innerHTML=state.hands[p].length?'<div class="back"></div><div class="mini">'+state.hands[p].length+'</div>':''}let allowed=state.phase==='play'&&state.turn===0?new Set(validCards(0).map(c=>c.id)):new Set();$('hand').innerHTML=state.hands[0].map(c=>cardHtml(c,state.phase==='play'&&state.turn===0?(allowed.has(c.id)?'legal':'illegal'):'' )).join('');$('hand').querySelectorAll('.card').forEach(el=>el.onclick=()=>humanPlay(el.dataset.id));let positions=['p0','p1','p2','p3'];$('playArea').innerHTML=state.trick.map(t=>`<div class="played ${positions[t.p]}">${cardHtml(t.card)}</div>`).join('');let active=state.phase==='play'&&state.turn===0;for(let a of ['busso','striscio','volo'])$(a).disabled=!active;$('footer').textContent=active?'È il tuo turno: scegli una carta':'Le carte vengono giocate in ordine'}function humanPlay(id){if(!state||state.phase!=='play'||state.turn!==0||state.busy)return;let c=validCards(0).find(x=>x.id===id);if(!c){toast('Devi rispondere al seme!');return}play(0,c)}function play(p,c){if(!state||state.phase!=='play'||p!==state.turn)return;let idx=state.hands[p].findIndex(x=>x.id===c.id);if(idx<0)return;state.hands[p].splice(idx,1);state.trick.push({p,card:c});state.turn=(p+1)%4;render();if(state.trick.length===4){state.busy=true;timer=setTimeout(resolveTrick,900)}else runTurn()}function botCard(p){let valid=validCards(p);if(!state.trick.length){return valid.slice().sort((a,b)=>a.r-b.r)[0]}let current=winning(state.trick);let lead=state.trick[0].card.s;let winningCards=valid.filter(c=>winning([...state.trick,{p,card:c}]).p===p);if(team(current.p)===team(p))return valid.slice().sort((a,b)=>cardValueThirds(a)-cardValueThirds(b)||a.r-b.r)[0];if(winningCards.length)return winningCards.sort((a,b)=>cardValueThirds(a)-cardValueThirds(b)||a.r-b.r)[0];return valid.slice().sort((a,b)=>cardValueT
